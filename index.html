<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>rEvo Checklist</title>
<style>
  :root{
    --bg:#0d1b12; --card:#14241a; --card2:#0f1e15; --line:#22382b;
    --txt:#e8f2ea; --dim:#93ab99; --green:#00b551; --green-dark:#00843D;
    --yellow:#FFC72C; --red:#ff5252; --blue:#4dabf7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:10px 14px 0 14px;
  }
  .topbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  h1{font-size:20px; margin:0; letter-spacing:.5px; display:flex; align-items:center; gap:8px;}
  h1 .o2{color:var(--green);}
  .mode-toggle{
    margin-left:auto; display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden;
    font-size:12px;
  }
  .mode-toggle button{
    background:none; border:none; color:var(--dim); padding:6px 12px; font-size:12px; cursor:pointer;
  }
  .mode-toggle button.on{background:var(--green-dark); color:#fff; font-weight:600;}
  /* scrubber widget */
  .scrubber{
    margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; display:flex; align-items:center; gap:10px; font-size:13px;
  }
  .scrubber label{color:var(--dim); white-space:nowrap;}
  .scrubber input{
    width:60px; background:var(--card2); border:1px solid var(--line); border-radius:6px;
    color:var(--txt); font-size:15px; padding:4px 6px; text-align:center;
  }
  .scrubber .bar{flex:1; height:8px; background:var(--card2); border-radius:4px; overflow:hidden; min-width:60px;}
  .scrubber .bar i{display:block; height:100%; background:var(--green); border-radius:4px; transition:width .3s;}
  .scrubber .rem{white-space:nowrap; font-weight:600;}
  /* tabs */
  nav{
    display:flex; overflow-x:auto; gap:4px; padding:10px 0 8px 0;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto; background:var(--card); color:var(--dim); border:1px solid var(--line);
    border-radius:18px; padding:7px 13px; font-size:13.5px; cursor:pointer; white-space:nowrap;
  }
  nav button.on{background:var(--green-dark); border-color:var(--green-dark); color:#fff; font-weight:600;}
  nav button .cnt{font-size:11px; opacity:.85;}
  main{padding:12px 14px 90px 14px; max-width:640px; margin:0 auto;}
  .listhead{display:flex; align-items:center; gap:10px; margin:6px 0 12px 0; flex-wrap:wrap;}
  .listhead h2{font-size:17px; margin:0; flex:1;}
  .progress{
    height:6px; background:var(--card); border-radius:3px; overflow:hidden; width:100%;
  }
  .progress i{display:block; height:100%; background:var(--green); transition:width .3s; border-radius:3px;}
  .reset-btn{
    background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px;
    padding:6px 12px; font-size:12.5px; cursor:pointer;
  }
  .desc{color:var(--dim); font-size:13px; margin:0 0 12px 0;}
  .group{
    margin:18px 0 8px 0; font-size:12.5px; font-weight:700; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--green);
    display:flex; align-items:center; gap:8px;
  }
  .group::after{content:""; flex:1; height:1px; background:var(--line);}
  /* items */
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start;
    cursor:pointer; user-select:none; transition:background .15s;
  }
  .item.checked{background:var(--card2); border-color:var(--line);}
  .item.checked .t{color:var(--dim); text-decoration:line-through; text-decoration-color:rgba(147,171,153,.5);}
  .box{
    flex:0 0 26px; width:26px; height:26px; border:2px solid var(--dim); border-radius:8px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
    font-size:16px; color:transparent; transition:all .15s;
  }
  .item.checked .box{background:var(--green); border-color:var(--green); color:#fff;}
  .body{flex:1; min-width:0;}
  .t{font-size:15.5px; font-weight:500;}
  .sub{font-size:13px; color:var(--dim); margin-top:3px;}
  .badge{
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.5px;
    background:rgba(77,171,247,.15); color:var(--blue); border-radius:5px; padding:1px 6px;
    margin-right:6px; vertical-align:2px;
  }
  .warnb{background:rgba(255,199,44,.15); color:var(--yellow);}
  .fields{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .fields .f{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--dim);}
  .fields input{
    width:64px; background:var(--bg); border:1px solid var(--line); border-radius:7px;
    color:var(--txt); font-size:15px; padding:6px; text-align:center;
  }
  .timerbtn{
    margin-top:8px; background:var(--card2); border:1px solid var(--green-dark); color:var(--green);
    border-radius:8px; padding:7px 14px; font-size:14px; font-weight:600; cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .timerbtn.running{background:var(--green-dark); color:#fff;}
  .timerbtn.done{background:var(--yellow); border-color:var(--yellow); color:#1A1A1A; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.55;}}
  /* info cards */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:10px; font-size:14px;
  }
  .card h3{margin:0 0 8px 0; font-size:15px; color:var(--green);}
  .card ul{margin:6px 0 0 0; padding-left:20px;}
  .card li{margin-bottom:5px;}
  .card.warn{border-color:rgba(255,199,44,.5); background:rgba(255,199,44,.07);}
  .card.warn h3{color:var(--yellow);}
  .card.danger{border-color:rgba(255,82,82,.5); background:rgba(255,82,82,.06);}
  .card.danger h3{color:var(--red);}
  .card a{color:var(--blue);}
  .always li::marker{color:var(--green);}
  .never li::marker{color:var(--red);}
  .footer-actions{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:linear-gradient(transparent, var(--bg) 35%);
    padding:18px 14px calc(12px + env(safe-area-inset-bottom)) 14px;
    display:flex; gap:10px; justify-content:center;
  }
  .footer-actions button{
    background:var(--card); color:var(--txt); border:1px solid var(--line);
    border-radius:22px; padding:11px 20px; font-size:14px; font-weight:600; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  .footer-actions button.primary{background:var(--green-dark); border-color:var(--green-dark); color:#fff;}
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:var(--green-dark); color:#fff; border-radius:10px; padding:10px 18px;
    font-size:14px; z-index:50; opacity:0; transition:opacity .3s; pointer-events:none;
  }
  .toast.show{opacity:1;}
  .complete-banner{
    background:var(--green-dark); color:#fff; border-radius:12px; padding:12px 16px;
    text-align:center; font-weight:700; margin-bottom:12px; display:none;
  }
  .complete-banner.show{display:block;}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <h1>rEvo <span class="o2">✓</span> Checklist</h1>
    <div class="mode-toggle" id="modeToggle">
      <button data-mode="mccr">mCCR</button>
      <button data-mode="hccr">hCCR / rMS</button>
    </div>
  </div>
  <div class="scrubber">
    <label for="scrubMin">Scrubber</label>
    <input type="number" id="scrubMin" min="0" max="999" inputmode="numeric" placeholder="0">
    <span style="color:var(--dim)">min usati</span>
    <div class="bar"><i id="scrubBar"></i></div>
    <span class="rem" id="scrubRem"></span>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="main"></main>

<div class="footer-actions">
  <button class="primary" id="newDive">🤿 Nuova immersione</button>
  <button id="resetAll">Azzera tutto</button>
</div>
<div class="toast" id="toast"></div>

  desc:'Manuale §3.6, §4.7 e capitolo 5. Scadenze da rispettare nel tempo.',
  items:[
    {group:'Mensile'},

    {group:'Ogni settimana di immersioni'},

{

/* ================= STATO ================= */

const LS_KEY = 'revoChecklist.v1';
let state = { mode:'mccr', checks:{}, values:{}, scrub:'', dates:{} };
try{ Object.assign(state, JSON.parse(localStorage.getItem(LS_KEY)||'{}')); }catch(e){}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

let currentTab = location.hash ? location.hash.slice(1) : 'build';
if(!CHECKLISTS.some(c=>c.id===currentTab)) currentTab='build';

/* ================= RENDER ================= */

const $tabs = document.getElementById('tabs');
const $main = document.getElementById('main');

function visibleItems(cl){
  return cl.items.filter(it => !it.group && (!it.hccr || state.mode==='hccr'));
}
function counts(cl){
  if(cl.info) return null;
  const vis = visibleItems(cl);
  const done = vis.filter((it,i)=> state.checks[keyOf(cl,it)] ).length;
  return {done, tot:vis.length};
}
function keyOf(cl,it){ return cl.id+'|'+it.t; }

function renderTabs(){
  $tabs.innerHTML='';
  CHECKLISTS.forEach(cl=>{
    const b=document.createElement('button');
    const c=counts(cl);
    b.innerHTML = cl.tab + (c? ` <span class="cnt">${c.done}/${c.tot}</span>`:'');
    if(cl.id===currentTab) b.classList.add('on');
    b.onclick=()=>{ currentTab=cl.id; location.hash=cl.id; render(); window.scrollTo(0,0); };
    $tabs.appendChild(b);
  });
}

function renderList(cl){
  const frag=document.createDocumentFragment();

  const head=document.createElement('div'); head.className='listhead';
  const h2=document.createElement('h2'); h2.textContent=cl.title; head.appendChild(h2);
  if(!cl.info){
    const rb=document.createElement('button'); rb.className='reset-btn'; rb.textContent='↺ Azzera';
    rb.onclick=()=>{ resetList(cl.id); };
    head.appendChild(rb);
  }
  frag.appendChild(head);

  if(!cl.info){
    const c=counts(cl);
    const pr=document.createElement('div'); pr.className='progress';
    pr.innerHTML=`<i style="width:${c.tot? (100*c.done/c.tot):0}%"></i>`;
    frag.appendChild(pr);
    const banner=document.createElement('div');
    banner.className='complete-banner'+(c.tot>0 && c.done===c.tot?' show':'');
    banner.textContent='✔ Checklist completata';
    frag.appendChild(banner);
  }
  if(cl.desc){
    const d=document.createElement('p'); d.className='desc';
    d.textContent=cl.desc + (state.dates[cl.id]? ' — azzerata: '+state.dates[cl.id]:'');
    d.style.marginTop='10px';
    frag.appendChild(d);
  }

  cl.items.forEach(it=>{
    if(it.group){
      const g=document.createElement('div'); g.className='group'; g.textContent=it.group;
      frag.appendChild(g); return;
    }
    if(it.hccr && state.mode!=='hccr') return;

    const key=keyOf(cl,it);
    const row=document.createElement('div');
    row.className='item'+(state.checks[key]?' checked':'');
    if(cl.info) row.style.cursor='default';

    const box=document.createElement('div'); box.className='box'; box.textContent='✓';
    if(cl.info) box.style.display='none';
    row.appendChild(box);

    const body=document.createElement('div'); body.className='body';
    const t=document.createElement('div'); t.className='t';
    t.innerHTML = (it.hccr?'<span class="badge">hCCR/rMS</span>':'') + escapeHtml(it.t);
    body.appendChild(t);
    if(it.sub){ const s=document.createElement('div'); s.className='sub'; s.textContent=it.sub; body.appendChild(s); }

    if(it.fields){
      const fw=document.createElement('div'); fw.className='fields';
      it.fields.forEach(f=>{
        const fk=cl.id+'|'+f.k;
        const lab=document.createElement('label'); lab.className='f';
        const inp=document.createElement('input');
        inp.type='text'; inp.inputMode='decimal'; inp.placeholder='—';
        inp.value=state.values[fk]||'';
        inp.onclick=e=>e.stopPropagation();
        inp.oninput=()=>{ state.values[fk]=inp.value; save(); };
        lab.appendChild(inp);
        const sp=document.createElement('span'); sp.textContent=f.label; lab.appendChild(sp);
        fw.appendChild(lab);
      });
      body.appendChild(fw);
    }

    if(it.timer){
      const tb=document.createElement('button'); tb.className='timerbtn';
      tb.textContent='▶ Timer '+fmtTime(it.timer);
      tb.onclick=e=>{ e.stopPropagation(); toggleTimer(tb, it.timer); };
      body.appendChild(tb);
    }

    row.appendChild(body);
    if(!cl.info){
      row.onclick=()=>{
        state.checks[key]=!state.checks[key]; save();
        row.classList.toggle('checked', !!state.checks[key]);
        if(navigator.vibrate) navigator.vibrate(10);
        renderTabs(); updateProgress(cl);
      };
    }
    frag.appendChild(row);
  });

  return frag;
}

function updateProgress(cl){
  const c=counts(cl); if(!c) return;
  const bar=$main.querySelector('.progress i');
  if(bar) bar.style.width=(c.tot? 100*c.done/c.tot:0)+'%';
  const banner=$main.querySelector('.complete-banner');
  if(banner) banner.classList.toggle('show', c.tot>0 && c.done===c.tot);
}

function render(){
  renderTabs();
  $main.innerHTML='';
  const cl=CHECKLISTS.find(c=>c.id===currentTab);
  $main.appendChild(cl.custom? renderInfo() : renderList(cl));
}

/* ================= AZIONI ================= */

function resetList(id, silent){
  const cl=CHECKLISTS.find(c=>c.id===id);
  cl.items.forEach(it=>{ if(!it.group) delete state.checks[keyOf(cl,it)]; });
  state.dates[id]=new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  save(); render();
  if(!silent) toast('Checklist azzerata');
}

document.getElementById('newDive').onclick=()=>{
  if(!confirm('Nuova immersione: azzero Closed check, Pre-jump e Tra immersioni?')) return;
  ['closed','prejump','between'].forEach(id=>resetList(id,true));
  toast('Pronto per una nuova immersione 🤿');
};
document.getElementById('resetAll').onclick=()=>{
  if(!confirm('Azzero TUTTE le checklist e i valori inseriti? (il contatore scrubber resta)')) return;
  state.checks={}; state.values={}; state.dates={};
  save(); render(); toast('Tutto azzerato');
};

/* mode toggle */
const $mt=document.getElementById('modeToggle');
function renderMode(){
  $mt.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.mode===state.mode));
}
$mt.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{ state.mode=b.dataset.mode; save(); renderMode(); render(); };
});

/* scrubber */
const SCRUB_MAX=160;
const $sm=document.getElementById('scrubMin');
$sm.value=state.scrub||'';
function renderScrub(){
  const used=parseInt(state.scrub||'0',10)||0;
  const rem=SCRUB_MAX-used;
  const bar=document.getElementById('scrubBar');
  bar.style.width=Math.min(100, 100*used/SCRUB_MAX)+'%';
  bar.style.background = used>=140? 'var(--red)' : used>=100? 'var(--yellow)' : 'var(--green)';
  document.getElementById('scrubRem').textContent = rem>=0? `${rem}′ su ${SCRUB_MAX}′` : `oltre limite!`;
  document.getElementById('scrubRem').style.color = rem<20? 'var(--red)' : rem<60? 'var(--yellow)' : 'var(--txt)';
}
$sm.oninput=()=>{ state.scrub=$sm.value; save(); renderScrub(); };

/* timer */
let activeTimer=null;
function fmtTime(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function toggleTimer(btn, secs){
  if(btn._int){ clearInterval(btn._int); btn._int=null; btn.className='timerbtn'; btn.textContent='▶ Timer '+fmtTime(secs); return; }
  if(activeTimer && activeTimer._int){ clearInterval(activeTimer._int); activeTimer._int=null; activeTimer.className='timerbtn'; }
  activeTimer=btn;
  let left=secs;
  btn.className='timerbtn running';
  btn.textContent='⏸ '+fmtTime(left);
  btn._int=setInterval(()=>{
    left--;
    if(left<=0){
      clearInterval(btn._int); btn._int=null;
      btn.className='timerbtn done'; btn.textContent='✔ Tempo! (tocca per riavviare)';
      if(navigator.vibrate) navigator.vibrate([300,150,300,150,600]);
      beep();
    } else btn.textContent='⏸ '+fmtTime(left);
  },1000);
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,.35,.7].forEach(t0=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; g.gain.setValueAtTime(.4, ctx.currentTime+t0);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t0+.3);
      o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+.3);
    });
  }catch(e){}
}

/* toast */
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 2200);
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* init */
renderMode(); renderScrub(); render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
