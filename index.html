<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>rEvo Checklist</title>
<style>
  :root{
    --bg:#0d1b12; --card:#14241a; --card2:#0f1e15; --line:#22382b;
    --txt:#e8f2ea; --dim:#93ab99; --green:#00b551; --green-dark:#00843D;
    --yellow:#FFC72C; --red:#ff5252; --blue:#4dabf7; --pink:#f783ac;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:10px 14px 0 14px;
  }
  .topbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  h1{font-size:20px; margin:0; letter-spacing:.5px; display:flex; align-items:center; gap:8px;}
  h1 .o2{color:var(--green);}
  .userchip{
    margin-left:auto; display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:20px;
    background:var(--card); color:var(--txt); padding:5px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .userchip .dot{width:9px; height:9px; border-radius:50%;}
  /* scrubber widget */
  .scrubber{
    margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; display:flex; align-items:center; gap:10px; font-size:13px;
  }
  .scrubber label{color:var(--dim); white-space:nowrap;}
  .scrubber input{
    width:60px; background:var(--card2); border:1px solid var(--line); border-radius:6px;
    color:var(--txt); font-size:15px; padding:4px 6px; text-align:center;
  }
  .scrubber .bar{flex:1; height:8px; background:var(--card2); border-radius:4px; overflow:hidden; min-width:60px;}
  .scrubber .bar i{display:block; height:100%; background:var(--green); border-radius:4px; transition:width .3s;}
  .scrubber .rem{white-space:nowrap; font-weight:600;}
  /* tabs */
  nav{
    display:flex; overflow-x:auto; gap:4px; padding:10px 0 8px 0;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto; background:var(--card); color:var(--dim); border:1px solid var(--line);
    border-radius:18px; padding:7px 13px; font-size:13.5px; cursor:pointer; white-space:nowrap;
  }
  nav button.on{background:var(--green-dark); border-color:var(--green-dark); color:#fff; font-weight:600;}
  nav button .cnt{font-size:11px; opacity:.85;}
  nav button.sec{opacity:.62;}
  nav .navdiv{flex:0 0 1px; width:1px; align-self:stretch; background:var(--dim); opacity:.5; margin:0 5px;}
  nav button .stepno{
    display:inline-block; background:var(--green-dark); color:#fff; border-radius:4px;
    font-size:10px; font-weight:800; padding:0 4px; margin-right:5px; vertical-align:1px;
  }
  nav button.on .stepno{background:rgba(255,255,255,.25);}
  main{padding:12px 14px 90px 14px; max-width:640px; margin:0 auto;}
  .listhead{display:flex; align-items:center; gap:10px; margin:6px 0 12px 0; flex-wrap:wrap;}
  .listhead h2{font-size:17px; margin:0; flex:1;}
  .progress{
    height:6px; background:var(--card); border-radius:3px; overflow:hidden; width:100%;
  }
  .progress i{display:block; height:100%; background:var(--green); transition:width .3s; border-radius:3px;}
  .reset-btn{
    background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px;
    padding:6px 12px; font-size:12.5px; cursor:pointer;
  }
  .desc{color:var(--dim); font-size:13px; margin:0 0 12px 0;}
  .group{
    margin:18px 0 8px 0; font-size:12.5px; font-weight:700; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--green);
    display:flex; align-items:center; gap:8px;
  }
  .group::after{content:""; flex:1; height:1px; background:var(--line);}
  /* items */
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start;
    cursor:pointer; user-select:none; transition:background .15s;
  }
  .item.checked{background:var(--card2); border-color:var(--line);}
  .item.checked .t{color:var(--dim); text-decoration:line-through; text-decoration-color:rgba(147,171,153,.5);}
  .box{
    flex:0 0 26px; width:26px; height:26px; border:2px solid var(--dim); border-radius:8px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
    font-size:16px; color:transparent; transition:all .15s;
  }
  .item.checked .box{background:var(--green); border-color:var(--green); color:#fff;}
  .body{flex:1; min-width:0;}
  .t{font-size:15.5px; font-weight:500;}
  .sub{font-size:13px; color:var(--dim); margin-top:3px;}
  .badge{
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.5px;
    background:rgba(77,171,247,.15); color:var(--blue); border-radius:5px; padding:1px 6px;
    margin-right:6px; vertical-align:2px;
  }
  .warnb{background:rgba(255,199,44,.15); color:var(--yellow);}
  .fields{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .fields .f{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--dim);}
  .fields input{
    width:64px; background:var(--bg); border:1px solid var(--line); border-radius:7px;
    color:var(--txt); font-size:15px; padding:6px; text-align:center;
  }
  .calcbox{
    margin-top:10px; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; cursor:default;
  }
  .calcbox .ctit{font-size:12.5px; font-weight:700; color:var(--green); margin-bottom:8px;}
  .calcbox .crow{display:flex; gap:10px; flex-wrap:wrap;}
  .calcbox .f{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--dim);}
  .calcbox input{
    width:64px; background:var(--bg); border:1px solid var(--line); border-radius:7px;
    color:var(--txt); font-size:15px; padding:6px; text-align:center;
  }
  .calcbox .cgroup{font-size:11.5px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; margin:8px 0 5px 0;}
  .calcbox .cgroup:first-of-type{margin-top:0;}
  .calcbox .cres{margin-top:8px; font-size:14px; display:none;}
  .calcbox .cres b{color:var(--green); font-size:16px;}
  .calcbox .cres .chm{color:var(--dim); font-size:13px;}
  .calcbox .cwarn{margin-top:8px; font-size:12px; color:var(--yellow);}
  .calcbox .cmsgs{margin-top:8px; font-size:12.5px; color:var(--dim); display:none;}
  .calcbox .cmsgs div{margin-bottom:3px;}
  .calcbox .cmsgs .ccycle{color:var(--red); font-weight:700; font-size:13.5px;}
  .calcbox .cnote{margin-top:6px; font-size:11.5px; color:var(--dim); display:none;}
  .timerbtn{
    margin-top:8px; background:var(--card2); border:1px solid var(--green-dark); color:var(--green);
    border-radius:8px; padding:7px 14px; font-size:14px; font-weight:600; cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .timerbtn.running{background:var(--green-dark); color:#fff;}
  .timerbtn.done{background:var(--yellow); border-color:var(--yellow); color:#1A1A1A; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.55;}}
  /* info cards */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:10px; font-size:14px;
  }
  .card h3{margin:0 0 8px 0; font-size:15px; color:var(--green);}
  .card ul{margin:6px 0 0 0; padding-left:20px;}
  .card li{margin-bottom:5px;}
  .card.warn{border-color:rgba(255,199,44,.5); background:rgba(255,199,44,.07);}
  .card.warn h3{color:var(--yellow);}
  .card.danger{border-color:rgba(255,82,82,.5); background:rgba(255,82,82,.06);}
  .card.danger h3{color:var(--red);}
  .card a{color:var(--blue);}
  .always li::marker{color:var(--green);}
  .never li::marker{color:var(--red);}
  .footer-actions{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:linear-gradient(transparent, var(--bg) 35%);
    padding:18px 14px calc(12px + env(safe-area-inset-bottom)) 14px;
    display:flex; gap:10px; justify-content:center;
  }
  .footer-actions button{
    background:var(--card); color:var(--txt); border:1px solid var(--line);
    border-radius:22px; padding:11px 20px; font-size:14px; font-weight:600; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  .footer-actions button.primary{background:var(--green-dark); border-color:var(--green-dark); color:#fff;}
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:var(--green-dark); color:#fff; border-radius:10px; padding:10px 18px;
    font-size:14px; z-index:50; opacity:0; transition:opacity .3s; pointer-events:none;
    max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1;}
  .complete-banner{
    background:var(--green-dark); color:#fff; border-radius:12px; padding:12px 16px;
    text-align:center; font-weight:700; margin-bottom:12px; display:none;
  }
  .complete-banner.show{display:block;}
  /* ===== schermata selezione utente ===== */
  .userscreen{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; text-align:center;
  }
  .userscreen.hidden{display:none;}
  .userscreen .biglogo{font-size:52px; line-height:1;}
  .userscreen h2{margin:4px 0 2px 0; font-size:22px;}
  .userscreen p{margin:0 0 14px 0; color:var(--dim); font-size:14px;}
  .userbtn{
    width:100%; max-width:320px; display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    color:var(--txt); font-size:19px; font-weight:700; padding:18px 22px; cursor:pointer;
    transition:transform .1s;
  }
  .userbtn:active{transform:scale(.98);}
  .userbtn .avatar{
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:#fff; flex:0 0 44px;
  }
  .userbtn .last{margin-left:auto; font-size:11px; font-weight:600; color:var(--dim);}
  .userbtn.add{border-style:dashed; color:var(--dim); font-weight:600; font-size:16px;}
  .userbtn.add .avatar{background:var(--card2); color:var(--dim); border:1px dashed var(--dim);}
  .userscreen .note{font-size:12px; color:var(--dim); max-width:320px;}
  /* ===== home ===== */
  .hello{font-size:21px; font-weight:700; margin:8px 0 14px 0; display:flex; align-items:center; gap:10px;}
  .hello .dot{width:12px; height:12px; border-radius:50%;}
  .homebtn{
    width:100%; display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    color:var(--txt); padding:16px; font-size:16.5px; font-weight:700; cursor:pointer; margin-bottom:10px;
  }
  .homebtn.primary{background:var(--green-dark); border-color:var(--green-dark); color:#fff;}
  .homebtn .ico{font-size:24px;}
  .homebtn .sub2{display:block; font-size:12.5px; font-weight:400; opacity:.75; margin-top:2px;}
  .stepcard{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; cursor:pointer;
  }
  .stepcard.done{border-color:var(--green-dark); background:rgba(0,132,61,.10);}
  .stephead{display:flex; align-items:center; gap:8px; margin-bottom:8px; padding-right:34px;}
  .stepbadge{
    background:var(--green-dark); color:#fff; font-size:10.5px; font-weight:800; letter-spacing:.8px;
    border-radius:5px; padding:2px 7px; white-space:nowrap;
  }
  .stepwhen{color:var(--dim); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;}
  .steprow{display:flex; align-items:center; gap:12px;}
  .steptitle{font-size:16.5px; font-weight:700; white-space:nowrap;}
  .steprow .mini{flex:1; height:5px; background:var(--card2); border-radius:3px; overflow:hidden; min-width:40px;}
  .steprow .mini i{display:block; height:100%; background:var(--green);}
  .steprow .nums{font-size:12.5px; color:var(--dim); font-weight:600; white-space:nowrap;}
  .stepcard.done .nums{color:var(--green);}
  .steprst{
    position:absolute; top:10px; right:10px; background:var(--card2); border:1px solid var(--line);
    color:var(--dim); border-radius:8px; width:28px; height:28px; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .alttoggle{
    background:none; border:none; color:var(--dim); font-size:13.5px; font-weight:700;
    padding:12px 2px 8px 2px; cursor:pointer; display:block;
  }
  .progrow.alt{background:var(--card2);}
  .sect{
    margin:20px 0 8px 0; font-size:12.5px; font-weight:700; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--green);
    display:flex; align-items:center; gap:8px;
  }
  .sect::after{content:""; flex:1; height:1px; background:var(--line);}
  .progrow{
    width:100%; display:flex; align-items:center; gap:12px; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    color:var(--txt); padding:12px 14px; font-size:14.5px; font-weight:600; cursor:pointer; margin-bottom:8px;
  }
  .progrow .mini{flex:1; height:5px; background:var(--card2); border-radius:3px; overflow:hidden; min-width:40px;}
  .progrow .mini i{display:block; height:100%; background:var(--green);}
  .progrow .nums{font-size:12.5px; color:var(--dim); font-weight:600; white-space:nowrap;}
  /* ===== log ===== */
  .filters{display:flex; gap:6px; margin:0 0 12px 0; flex-wrap:wrap;}
  .filters button{
    background:var(--card); border:1px solid var(--line); color:var(--dim);
    border-radius:16px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .filters button.on{background:var(--green-dark); border-color:var(--green-dark); color:#fff;}
  .filters button .dot{width:8px; height:8px; border-radius:50%;}
  .logentry{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; font-size:14px;
  }
  .logentry .top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .logentry .when{color:var(--dim); font-size:12.5px; white-space:nowrap;}
  .logentry .who{
    display:inline-flex; align-items:center; gap:5px; font-weight:700; font-size:13px;
  }
  .logentry .who .dot{width:8px; height:8px; border-radius:50%;}
  .logentry .what{font-weight:600; flex:1; min-width:120px;}
  .logentry .del{
    background:none; border:none; color:var(--dim); font-size:15px; cursor:pointer; padding:2px 6px;
  }
  .logentry .vals{margin-top:8px; display:flex; gap:5px; flex-wrap:wrap;}
  .logentry .vals span{
    background:var(--card2); border:1px solid var(--line); border-radius:6px;
    padding:2px 7px; font-size:12px; color:var(--dim);
  }
  .logentry .vals span b{color:var(--txt); font-weight:600;}
  .empty{color:var(--dim); text-align:center; padding:30px 10px; font-size:14px;}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <h1>rEvo <span class="o2">✓</span> Checklist</h1>
    <button class="userchip" id="userChip" title="Cambia subacqueo"><span class="dot"></span><span class="nm"></span> ⇄</button>
  </div>
  <div class="scrubber">
    <label for="scrubMin">Scrubber</label>
    <input type="number" id="scrubMin" min="0" max="999" inputmode="numeric" placeholder="0">
    <span style="color:var(--dim)">min usati</span>
    <div class="bar"><i id="scrubBar"></i></div>
    <span class="rem" id="scrubRem"></span>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="main"></main>

<div class="footer-actions">
  <button class="primary" id="newDive">🤿 Nuova immersione</button>
  <button id="resetAll">Azzera tutto</button>
</div>
<div class="toast" id="toast"></div>

<div class="userscreen hidden" id="userScreen">
  <div class="biglogo">rEvo <span style="color:var(--green)">✓</span></div>
  <h2>Chi si immerge?</h2>
  <p>Seleziona il subacqueo: checklist e valori restano separati, il log è condiviso.</p>
  <div id="userBtns" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:10px;"></div>
  <div class="note" id="userNote"></div>
</div>

<script>
"use strict";

/* ================= UTENTI ================= */

const USERS = [
  {id:'francois', name:'François', color:'var(--blue)'},
  {id:'orietta',  name:'Orietta',  color:'var(--pink)'},
];
const USER_COLORS=['#ffd43b','#69db7c','#b197fc','#ffa94d','#63e6be','#74c0fc','#e599f7','#ff8787'];
function allUsers(){ return USERS.concat(state.customUsers||[]); }
function userOf(id){ return allUsers().find(u=>u.id===id); }

/* ================= DATI =================
   Montaggio + Closed check: checklist italiana di Aldo
   (Controllo di montaggio rEvo v0.4 + Closed check versione 2025/11).
   Le altre schede: manuale rEvo III CE v05. */

const CHECKLISTS = [
{
  id:'home', tab:'🏠 Home', title:'Home', custom:'home', items:[]
},
{
  id:'build', tab:'🔧 Montaggio', title:'Controllo di montaggio',
  desc:'Step 1 — il giorno prima. Checklist italiana (Aldo), rEvo v0.4: da fare con calma, prima di partire.',
  items:[
    {t:'Analizzare il contenuto della bombola ossigeno', fields:[{k:'o2_pct',label:'%O₂',lg:'O₂ %O₂'},{k:'o2_bar',label:'bar',lg:'O₂ bar'}]},
    {t:'Analizzare il contenuto della bombola diluente', fields:[{k:'dil_o2',label:'%O₂',lg:'dil %O₂'},{k:'dil_he',label:'%He',lg:'dil %He'},{k:'dil_bar',label:'bar',lg:'dil bar'}]},
    {t:'Installare entrambe le bombole: controllare il fissaggio'},
    {t:'Avvitare i primi stadi sulle bombole'},
    {t:'Controllare i millivolt in aria', fields:[{k:'mv1',label:'sens. 1'},{k:'mv2',label:'sens. 2'},{k:'mv3',label:'sens. 3'},{k:'mv4',label:'sens. 4'},{k:'mv5',label:'sens. 5'}]},
    {t:'Controllare la batteria esterna: far funzionare il solenoide 10 sec.', sub:'V > 6,5 V! Per far sparare il solenoide: imposta il set point a 0,7, aspetta 15–20 sec e rimettilo a 0,19 (la voce set point è dopo il Bluetooth nel menu del Petrel).'},
    {t:'Controllare la batteria interna attraverso la rappresentazione grafica'},
    {t:'Controllare la vita dei sensori: il sensore più giovane deve essere < 7 mesi!', sub:'Se non è presente, sostituire quello che ritenete più debole e segnare la data.'},
    {t:'Controllare la vita residua dei filtri', sub:'Se la vita del filtro è terminata: spostare il filtro di inspirazione (inferiore) nel canister superiore, sostituire l’assorbente del filtro superiore e metterlo nel canister inferiore.', calc:true},
    {t:'Prima di inserire i filtri, inserire i panni sul fondo dei due contropolmoni'},
    {t:'Se i filtri non scendono completamente nei rispettivi canister', sub:'Controllare la posizione della griglia sensori e della griglia porta-solenoide con il relativo giro di cavi e tubi.'},
    {t:'Posizionare il TOP MARKER sul filtro superiore', sub:'RMS con le frecce verso l’alto.'},
    {t:'Controllare gli O-ring degli scrubber', sub:'Pulire le sedi delle guarnizioni, ingrassare se necessario, chiudere il coperchio e serrare a mano la vite.'},
    {t:'Controllare i tubi di respirazione, il suono delle valvole di non ritorno, il boccaglio e gli O-ring del loop', sub:'Pulire le superfici di innesto e ingrassare se necessario.'},
    {t:'Installare il loop sul rebreather!'},
    {t:'Avvolgere il cavo dell’HUD o del NERD attorno al tubo di respirazione'},
  ]
},
{
  id:'closed', tab:'🔒 Closed check', title:'Closed check',
  desc:'Step 2 — il giorno prima o il giorno dell’immersione. Checklist italiana (Aldo), versione 2025/11: a unità assemblata e chiusa.',
  items:[
    {group:'Ossigeno'},
    {t:'Aprire O₂ \\ aggiungere O₂ manualmente \\ la pressione è stabile?'},
    {t:'Accendere Shearwater: mettere set point 0,7 \\ il solenoide funziona?', sub:'La voce set point è dopo il Bluetooth nel menu del Petrel.'},
    {t:'Riportare il set point Shearwater a 0,19'},

const LS_KEY = 'revoChecklist.v2';
const LS_KEY_V1 = 'revoChecklist.v1';

function blankUser(){ return {checks:{}, values:{}, dates:{}, scrub:'', logged:{}}; }
let state = { user:null, users:{francois:blankUser(), orietta:blankUser()}, customUsers:[], log:[] };

try{
  const raw = localStorage.getItem(LS_KEY);
  if(raw){
    const s = JSON.parse(raw);
    if(s && typeof s==='object'){
      state.user = s.user || null;
      state.log = Array.isArray(s.log) ? s.log : [];
      state.customUsers = Array.isArray(s.customUsers) ? s.customUsers : [];
      USERS.concat(state.customUsers).forEach(u=>{
        state.users[u.id] = Object.assign(blankUser(), (s.users && s.users[u.id]) || {});
      });
    }
  } else {
    /* migrazione dalla v1: lo stato del vecchio dispositivo era di François */
    const v1 = localStorage.getItem(LS_KEY_V1);
    if(v1){
      const old = JSON.parse(v1);
      state.users.francois = Object.assign(blankUser(), {
        checks:old.checks||{}, values:old.values||{},
        dates:old.dates||{}, scrub:old.scrub||''
      });
    }
  }
}catch(e){}
if(state.user && !userOf(state.user)) state.user = null;

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function cur(){ return state.users[state.user] || state.users[USERS[0].id]; }

let currentTab = location.hash ? location.hash.slice(1) : 'home';
if(!CHECKLISTS.some(c=>c.id===currentTab)) currentTab='home';
let logFilter = 'all';

/* ================= RENDER ================= */

const $tabs = document.getElementById('tabs');
const $main = document.getElementById('main');

function visibleItems(cl){
  return cl.items.filter(it => !it.group);
}
function counts(cl){
  if(cl.info || cl.custom) return null;
  const vis = visibleItems(cl);
  const done = vis.filter(it => cur().checks[keyOf(cl,it)]).length;
  return {done, tot:vis.length};
}
function keyOf(cl,it){ return cl.id+'|'+it.t; }

/* ordine tab: percorso principale, log, poi le secondarie oltre il divisore */
const TAB_ORDER=['home','build','closed','prejump','log','water','between','endday','maint','info'];
const TAB_SEC=new Set(['water','between','endday','maint','info']);
const TAB_STEP={build:'1', closed:'2', prejump:'✓'};

function renderTabs(){
  $tabs.innerHTML='';
  TAB_ORDER.forEach((id,ix)=>{
    const cl=CHECKLISTS.find(c=>c.id===id);
    if(!cl) return;
    if(TAB_SEC.has(id) && !TAB_SEC.has(TAB_ORDER[ix-1])){
      const dv=document.createElement('span'); dv.className='navdiv';
      $tabs.appendChild(dv);
    }
    const b=document.createElement('button');
    const c=counts(cl);
    b.innerHTML = (TAB_STEP[id]? '<span class="stepno">'+TAB_STEP[id]+'</span>':'') + cl.tab + (c? ` <span class="cnt">${c.done}/${c.tot}</span>`:'');
    if(TAB_SEC.has(id)) b.classList.add('sec');
    if(cl.id===currentTab) b.classList.add('on');
    b.onclick=()=>{ goTab(cl.id); };
    $tabs.appendChild(b);
  });
}
function goTab(id){ currentTab=id; location.hash=id; render(); window.scrollTo(0,0); }

function renderList(cl){
  const frag=document.createDocumentFragment();

  const head=document.createElement('div'); head.className='listhead';
  const h2=document.createElement('h2'); h2.textContent=cl.title; head.appendChild(h2);
  if(!cl.info){
    const rb=document.createElement('button'); rb.className='reset-btn'; rb.textContent='↺ Azzera';
    rb.onclick=()=>{
      if(!confirm('Azzero spunte e valori di questa checklist per '+userOf(state.user).name+'?')) return;
      resetList(cl.id);
    };
    head.appendChild(rb);
  }
  frag.appendChild(head);

  if(!cl.info){
    const c=counts(cl);
    const pr=document.createElement('div'); pr.className='progress';
    pr.innerHTML=`<i style="width:${c.tot? (100*c.done/c.tot):0}%"></i>`;
    frag.appendChild(pr);
    const banner=document.createElement('div');
    banner.className='complete-banner'+(c.tot>0 && c.done===c.tot?' show':'');
    banner.textContent='✔ Checklist completata';
    frag.appendChild(banner);
  }
  if(cl.desc){
    const d=document.createElement('p'); d.className='desc';
    d.textContent=cl.desc + (cur().dates[cl.id]? ' — iniziata: '+cur().dates[cl.id]:'');
    d.style.marginTop='10px';
    frag.appendChild(d);
  }

  cl.items.forEach(it=>{
    if(it.group){
      const g=document.createElement('div'); g.className='group'; g.textContent=it.group;
      frag.appendChild(g); return;
    }
    const key=keyOf(cl,it);
    const row=document.createElement('div');
    row.className='item'+(cur().checks[key]?' checked':'');
    if(cl.info) row.style.cursor='default';

    const box=document.createElement('div'); box.className='box'; box.textContent='✓';
    if(cl.info) box.style.display='none';
    row.appendChild(box);

    const body=document.createElement('div'); body.className='body';
    const txt = it.t2 || it.t;
    const sub = it.sub2 || it.sub;
    const t=document.createElement('div'); t.className='t';
    t.innerHTML = escapeHtml(txt);
    body.appendChild(t);
    if(sub){ const s=document.createElement('div'); s.className='sub'; s.textContent=sub; body.appendChild(s); }

    if(it.fields){
      const fw=document.createElement('div'); fw.className='fields';
      it.fields.forEach(f=>{
        const fk=cl.id+'|'+f.k;
        const lab=document.createElement('label'); lab.className='f';
        const inp=document.createElement('input');
        inp.type='text'; inp.inputMode='decimal'; inp.placeholder='—';
        inp.value=cur().values[fk]||'';
        inp.onclick=e=>e.stopPropagation();
        inp.oninput=()=>{ cur().values[fk]=inp.value; save(); };
        lab.appendChild(inp);
        const sp=document.createElement('span'); sp.textContent=f.label; lab.appendChild(sp);
        fw.appendChild(lab);
      });
      body.appendChild(fw);
    }

    if(it.timer){
      const tb=document.createElement('button'); tb.className='timerbtn';
      tb.textContent='▶ Timer '+fmtTime(it.timer);
      tb.onclick=e=>{ e.stopPropagation(); toggleTimer(tb, it.timer); };
      body.appendChild(tb);
    }

    if(it.calc) body.appendChild(buildScrubCalc());

    row.appendChild(body);
    if(!cl.info){
      row.onclick=()=>{
        cur().checks[key]=!cur().checks[key];
        row.classList.toggle('checked', !!cur().checks[key]);
        if(navigator.vibrate) navigator.vibrate(10);
        maybeLogCompletion(cl);
        save();
        renderTabs(); updateProgress(cl);
      };
    }
    frag.appendChild(row);
  });

  return frag;
}

/* Calcolo calce residua — regole rMS come rEvoCalc (fr.videosub.revocalcrms, open source):
   1. pianificata oltre 4 °C più fredda della precedente → si fa il cycle, niente calcolo
   2. profondità dell’ultima immersione < 20 m → si considera 20 m
   3. pianificata ≤ profondità ultima → tempo disponibile = RCT registrato
   4. pianificata più profonda → T = RCT × (prof. ultima ÷ prof. pianificata)  */
function buildScrubCalc(){
  /* migrazione dal vecchio campo unico in minuti */
  const old=parseFloat(String(cur().values['calc|min']||'').replace(',','.'));
  if(isFinite(old) && old>0 && cur().values['calc|h']==null && cur().values['calc|m']==null){
    cur().values['calc|h']=String(Math.floor(old/60));
    cur().values['calc|m']=String(Math.round(old%60));
    delete cur().values['calc|min']; save();
  }

  const box=document.createElement('div'); box.className='calcbox';
  box.onclick=e=>e.stopPropagation();
  const tit=document.createElement('div'); tit.className='ctit'; tit.textContent='🧮 Calcolo calce RMS (regole rEvoCalc)';
  box.appendChild(tit);

  const num=v=>parseFloat(String(v).replace(',','.'));
  const mkIn=(row,key,ph,lbl)=>{
    const lab=document.createElement('label'); lab.className='f';
    const inp=document.createElement('input');
    inp.type='text'; inp.inputMode='decimal'; inp.placeholder=ph;
    inp.value=cur().values[key]||'';
    inp.oninput=()=>{ cur().values[key]=inp.value; save(); upd(); };
    lab.appendChild(inp);
    const sp=document.createElement('span'); sp.textContent=lbl; lab.appendChild(sp);
    row.appendChild(lab);
    return inp;
  };

  const g1=document.createElement('div'); g1.className='cgroup'; g1.textContent='Ultima immersione — dati dallo Shearwater';
  box.appendChild(g1);
  const row1=document.createElement('div'); row1.className='crow';
  const iH =mkIn(row1,'calc|h','0','ore');
  const iM =mkIn(row1,'calc|m','0','min RCT');
  const iLD=mkIn(row1,'calc|lastdepth','20','prof. (m)');
  const iLT=mkIn(row1,'calc|lasttemp','—','°C');
  box.appendChild(row1);

  const g2=document.createElement('div'); g2.className='cgroup'; g2.textContent='Immersione pianificata';
  box.appendChild(g2);
  const row2=document.createElement('div'); row2.className='crow';
  const iPD=mkIn(row2,'calc|depth','—','prof. (m)');
  const iPT=mkIn(row2,'calc|plantemp','—','°C');
  box.appendChild(row2);

  const msgs=document.createElement('div'); msgs.className='cmsgs';
  box.appendChild(msgs);
  const res=document.createElement('div'); res.className='cres';
  box.appendChild(res);
  const warn=document.createElement('div'); warn.className='cwarn';
  warn.textContent='⚠ Temperature: inserisci quella dell’ultima immersione e quella prevista — se la prossima è oltre 4 °C più fredda, si fa il cycle (regola rMS).';
  box.appendChild(warn);
  const note=document.createElement('div'); note.className='cnote';
  note.textContent='Ricontrolla i dati; in caso di dubbio chiedi al tuo istruttore.';
  box.appendChild(note);

  function fmtHM(t){ return Math.floor(t/60)+'h '+String(t%60).padStart(2,'0')+'m'; }
  function upd(){
    msgs.innerHTML=''; msgs.style.display='none';
    res.style.display='none'; note.style.display='none';
    const rct=(num(iH.value)||0)*60+(num(iM.value)||0);
    const ld=num(iLD.value), pd=num(iPD.value), lt=num(iLT.value), pt=num(iPT.value);
    const tempsGiven=isFinite(lt) && isFinite(pt);
    warn.style.display = tempsGiven? 'none':'block';
    if(!(rct>0) || !(pd>0)) return;
    note.style.display='block';
    const addMsg=(txt,cls)=>{
      const li=document.createElement('div'); li.className=cls||''; li.textContent='• '+txt;
      msgs.appendChild(li); msgs.style.display='block';
    };
    if(tempsGiven && (lt-pt)>4){
      addMsg('Immersione pianificata molto più fredda (oltre 4 °C in meno della precedente): SI FA IL CYCLE! Butta il sorb vecchio e fai un nuovo ciclo.','ccycle');
      return;
    }
    let d = (isFinite(ld) && ld>0)? ld : 20;
    if(!(isFinite(ld) && ld>0)) addMsg('Profondità ultima immersione non indicata: uso 20 m.');
    else if(d<20){ d=20; addMsg('Ultima immersione a 20 m o meno: uso 20 m come profondità.'); }
    let t;
    if(pd<=d){
      t=Math.floor(rct);
      addMsg('Profondità pianificata ≤ ultima immersione: tempo disponibile = RCT registrato.');
    }else{
      t=Math.floor(rct*(d/pd));
      addMsg('T = '+Math.round(rct)+'′ × ('+d+' ÷ '+Math.round(pd)+')');
    }
    res.innerHTML='→ tempo per l’immersione: <b>≈ '+t+' min</b>'+(t>=60?' <span class="chm">('+fmtHM(t)+')</span>':'');
    res.style.display='block';
  }
  upd();
  return box;
}

function updateProgress(cl){
  const c=counts(cl); if(!c) return;
  const bar=$main.querySelector('.progress i');
  if(bar) bar.style.width=(c.tot? 100*c.done/c.tot:0)+'%';
  const banner=$main.querySelector('.complete-banner');
  if(banner) banner.classList.toggle('show', c.tot>0 && c.done===c.tot);
}

/* ================= LOG ================= */

function snapshotValues(cl){
  const out={};
  cl.items.forEach(it=>{
    (it.fields||[]).forEach(f=>{
      const v=cur().values[cl.id+'|'+f.k];
      if(v!=null && String(v).trim()!=='') out[f.lg||f.label]=String(v).trim();
    });
  });
  return out;
}

function maybeLogCompletion(cl){
  const c=counts(cl);
  if(!c || c.tot===0 || c.done!==c.tot) return;
  if(cur().logged[cl.id]) return;
  cur().logged[cl.id]=true;
  state.log.unshift({
    id:Date.now(),
    user:state.user,
    list:cl.id,
    title:cl.title,
    tab:cl.tab,
    ts:new Date().toISOString(),
    tot:c.tot,
    scrub:cur().scrub||'',
    values:snapshotValues(cl),
  });
  save();
  toast('✔ '+cl.title+' registrata nel log di '+userOf(state.user).name);
}

function fmtTs(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+
         d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}

function renderLog(){
  const frag=document.createDocumentFragment();
  const head=document.createElement('div'); head.className='listhead';
  const h2=document.createElement('h2'); h2.textContent='📒 Log checklist'; head.appendChild(h2);
  const exp=document.createElement('button'); exp.className='reset-btn'; exp.textContent='⬇ Esporta CSV';
  exp.onclick=exportCsv;
  head.appendChild(exp);
  frag.appendChild(head);

  const filt=document.createElement('div'); filt.className='filters';
  const opts=[{id:'all',name:'Tutti'}].concat(allUsers());
  opts.forEach(o=>{
    const b=document.createElement('button');
    if(o.color) b.innerHTML='<span class="dot" style="background:'+o.color+'"></span>'+o.name;
    else b.textContent=o.name;
    if(logFilter===o.id) b.classList.add('on');
    b.onclick=()=>{ logFilter=o.id; render(); };
    filt.appendChild(b);
  });
  frag.appendChild(filt);

  const entries=state.log.filter(e=> logFilter==='all' || e.user===logFilter);
  if(!entries.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent='Nessuna checklist registrata'+(logFilter!=='all'?' per '+userOf(logFilter).name:'')+'. Le checklist completate al 100% finiscono qui automaticamente.';
    frag.appendChild(e);
    return frag;
  }

  entries.forEach(en=>{
    const u=userOf(en.user)||{name:en.user,color:'var(--dim)'};
    const div=document.createElement('div'); div.className='logentry';
    const top=document.createElement('div'); top.className='top';
    top.innerHTML=
      '<span class="who"><span class="dot" style="background:'+u.color+'"></span>'+escapeHtml(u.name)+'</span>'+
      '<span class="what">'+escapeHtml(en.tab||en.title)+'</span>'+
      '<span class="when">'+fmtTs(en.ts)+' · '+en.tot+'/'+en.tot+'</span>';
    const del=document.createElement('button'); del.className='del'; del.textContent='✕'; del.title='Elimina voce';
    del.onclick=()=>{
      if(!confirm('Elimino questa voce dal log?')) return;
      state.log=state.log.filter(x=>x.id!==en.id); save(); render();
    };
    top.appendChild(del);
    div.appendChild(top);
    const keys=Object.keys(en.values||{});
    if(keys.length || en.scrub){
      const vals=document.createElement('div'); vals.className='vals';
      keys.forEach(k=>{
        const s=document.createElement('span'); s.innerHTML=escapeHtml(k)+' <b>'+escapeHtml(en.values[k])+'</b>';
        vals.appendChild(s);
      });
      if(en.scrub){
        const s=document.createElement('span'); s.innerHTML='scrubber <b>'+escapeHtml(String(en.scrub))+'′</b>';
        vals.appendChild(s);
      }
      div.appendChild(vals);
    }
    frag.appendChild(div);
  });
  return frag;
}

function exportCsv(){
  if(!state.log.length){ toast('Il log è vuoto'); return; }
  const rows=[['Data','Utente','Checklist','Voci','Scrubber (min)','Valori']];
  state.log.slice().reverse().forEach(en=>{
    const u=userOf(en.user)||{name:en.user};
    const vals=Object.entries(en.values||{}).map(([k,v])=>k+'='+v).join(' | ');
    rows.push([fmtTs(en.ts), u.name, en.title, en.tot+'/'+en.tot, en.scrub||'', vals]);
  });
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='revo-log.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ================= HOME ================= */

function renderHome(){
  const frag=document.createDocumentFragment();
  const u=userOf(state.user);

  const hello=document.createElement('div'); hello.className='hello';
  hello.innerHTML='<span class="dot" style="background:'+u.color+'"></span>Ciao '+escapeHtml(u.name)+' 👋';
  frag.appendChild(hello);

  /* percorso principale: step 1 / step 2 / check finale */
  STEPS.forEach(st=>{
    const cl=CHECKLISTS.find(c=>c.id===st.id);
    const c=counts(cl);
    const done=c.tot>0 && c.done===c.tot;
    const card=document.createElement('div'); card.className='stepcard'+(done?' done':'');
    card.innerHTML=
      '<div class="stephead"><span class="stepbadge">'+escapeHtml(st.step)+'</span><span class="stepwhen">'+escapeHtml(st.when)+'</span></div>'+
      '<div class="steprow"><span class="steptitle">'+cl.tab+'</span>'+
      '<span class="mini"><i style="width:'+(c.tot?100*c.done/c.tot:0)+'%"></i></span>'+
      '<span class="nums">'+(done?'✔ '+c.tot+'/'+c.tot:(c.done? c.done+'/'+c.tot:'—'))+'</span></div>';
    card.onclick=()=>goTab(st.id);
    const rst=document.createElement('button'); rst.className='steprst'; rst.textContent='↺'; rst.title='Nuova (azzera e ricomincia)';
    rst.onclick=e=>{ e.stopPropagation(); startNew(st.id); };
    card.appendChild(rst);
    frag.appendChild(card);
  });

  const bLog=document.createElement('button'); bLog.className='homebtn';
  const nLog=state.log.length;
  bLog.innerHTML='<span class="ico">📒</span><span>Log checklist<span class="sub2">'+(nLog? nLog+' registrazioni':'ancora vuoto')+'</span></span>';
  bLog.onclick=()=>goTab('log');
  frag.appendChild(bLog);

  /* checklist secondarie */
  const at=document.createElement('button'); at.className='alttoggle';
  at.textContent=(othersOpen?'▾':'▸')+' Altre checklist (se servono)';
  at.onclick=()=>{ othersOpen=!othersOpen; render(); };
  frag.appendChild(at);
  if(othersOpen){
    OTHERS.forEach(id=>{
      const cl=CHECKLISTS.find(c=>c.id===id);
      const c=counts(cl);
      const r=document.createElement('button'); r.className='progrow alt';
      r.innerHTML='<span>'+cl.tab+'</span><span class="mini"><i style="width:'+(c.tot?100*c.done/c.tot:0)+'%"></i></span><span class="nums">'+(c.done? c.done+'/'+c.tot:'—')+'</span>';
      r.onclick=()=>goTab(id);
      frag.appendChild(r);
    });
  }

  /* ultime dal log */
  if(state.log.length){
    const s=document.createElement('div'); s.className='sect'; s.textContent='Ultime registrazioni';
    frag.appendChild(s);
    state.log.slice(0,3).forEach(en=>{
      const eu=userOf(en.user)||{name:en.user,color:'var(--dim)'};
      const r=document.createElement('button'); r.className='progrow';
      r.innerHTML='<span class="dot" style="width:9px;height:9px;border-radius:50%;background:'+eu.color+'"></span>'+
        '<span style="flex:1; text-align:left;">'+escapeHtml(en.tab||en.title)+'</span>'+
        '<span class="nums">'+escapeHtml(eu.name)+' · '+fmtTs(en.ts)+'</span>';
      r.onclick=()=>goTab('log');
      frag.appendChild(r);
    });
  }
  return frag;
}

function startNew(id){
  const cl=CHECKLISTS.find(c=>c.id===id);
  const c=counts(cl);
  if(c && c.done>0 && !confirm(cl.title+': azzero i progressi attuali ('+c.done+'/'+c.tot+') di '+userOf(state.user).name+' e inizio da capo?')) return;
  resetList(id, true);
  goTab(id);
  toast(cl.title+' — si parte!');
}

/* ================= RENDER PRINCIPALE ================= */

function render(){
  renderUserChip();
  renderScrub();
  renderTabs();
  $main.innerHTML='';
  if(!userOf(state.user)) return; /* nessun utente selezionato: resta la schermata di scelta */
  const cl=CHECKLISTS.find(c=>c.id===currentTab);
  if(cl.custom==='home') $main.appendChild(renderHome());
  else if(cl.custom==='log') $main.appendChild(renderLog());
  else if(cl.custom==='info') $main.appendChild(renderInfo());
  else $main.appendChild(renderList(cl));
}

/* ================= SELEZIONE UTENTE ================= */

const $userScreen=document.getElementById('userScreen');
const $userBtns=document.getElementById('userBtns');

function selectUser(id){
  state.user=id; save();
  $userScreen.classList.add('hidden');
  currentTab='home'; location.hash='home';
  render(); window.scrollTo(0,0);
}

function showUserScreen(){
  $userBtns.innerHTML='';
  allUsers().forEach(u=>{
    const b=document.createElement('button'); b.className='userbtn';
    b.innerHTML='<span class="avatar" style="background:'+u.color+'">'+escapeHtml(u.name[0])+'</span>'+escapeHtml(u.name)+
      (state.user===u.id?'<span class="last">ultimo utente</span>':'');
    b.onclick=()=>selectUser(u.id);
    $userBtns.appendChild(b);
  });
  const add=document.createElement('button'); add.className='userbtn add';
  add.innerHTML='<span class="avatar">＋</span>Aggiungi subacqueo';
  add.onclick=addDiver;
  $userBtns.appendChild(add);
  $userScreen.classList.remove('hidden');
}

function addDiver(){
  const name=(prompt('Nome del nuovo subacqueo:')||'').trim().slice(0,20);
  if(!name) return;
  if(allUsers().some(u=>u.name.toLowerCase()===name.toLowerCase())){
    alert('Esiste già un subacqueo con questo nome.');
    return;
  }
  const id='u'+Date.now().toString(36);
  const color=USER_COLORS[state.customUsers.length % USER_COLORS.length];
  state.customUsers.push({id, name, color});
  state.users[id]=blankUser();
  save();
  selectUser(id);
  toast('Nuovo subacqueo: '+name+' 🤿');
}

function renderUserChip(){
  const chip=document.getElementById('userChip');
  const u=userOf(state.user);
  if(!u){ chip.style.display='none'; return; }
  chip.style.display='flex';
  chip.querySelector('.dot').style.background=u.color;
  chip.querySelector('.nm').textContent=u.name;
}
document.getElementById('userChip').onclick=showUserScreen;

/* ================= AZIONI ================= */

function resetList(id, silent){
  const cl=CHECKLISTS.find(c=>c.id===id);
  cl.items.forEach(it=>{
    if(it.group) return;
    delete cur().checks[keyOf(cl,it)];
    (it.fields||[]).forEach(f=>{ delete cur().values[cl.id+'|'+f.k]; });
  });
  delete cur().logged[id];
  cur().dates[id]=new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  save(); render();
  if(!silent) toast('Checklist azzerata');
}

document.getElementById('newDive').onclick=()=>{
  if(!confirm('Nuova immersione per '+userOf(state.user).name+': azzero Closed check, Pre-jump e Tra immersioni?')) return;
  ['closed','prejump','between'].forEach(id=>resetList(id,true));
  toast('Pronto per una nuova immersione 🤿');
};
document.getElementById('resetAll').onclick=()=>{
  if(!confirm('Azzero TUTTE le checklist e i valori di '+userOf(state.user).name+'? (scrubber e log restano)')) return;
  const u=cur();
  u.checks={}; u.values={}; u.dates={}; u.logged={};
  save(); render(); toast('Tutto azzerato');
};

/* scrubber */
const SCRUB_MAX=160;
const $sm=document.getElementById('scrubMin');
function renderScrub(){
  if(document.activeElement!==$sm) $sm.value=cur().scrub||'';
  const used=parseInt(cur().scrub||'0',10)||0;
  const rem=SCRUB_MAX-used;
  const bar=document.getElementById('scrubBar');
  bar.style.width=Math.min(100, 100*used/SCRUB_MAX)+'%';
  bar.style.background = used>=140? 'var(--red)' : used>=100? 'var(--yellow)' : 'var(--green)';
  document.getElementById('scrubRem').textContent = rem>=0? `${rem}′ su ${SCRUB_MAX}′` : `oltre limite!`;
  document.getElementById('scrubRem').style.color = rem<20? 'var(--red)' : rem<60? 'var(--yellow)' : 'var(--txt)';
}
$sm.oninput=()=>{ cur().scrub=$sm.value; save(); renderScrub(); };

/* timer */
let activeTimer=null;
function fmtTime(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function toggleTimer(btn, secs){
  if(btn._int){ clearInterval(btn._int); btn._int=null; btn.className='timerbtn'; btn.textContent='▶ Timer '+fmtTime(secs); return; }
  if(activeTimer && activeTimer._int){ clearInterval(activeTimer._int); activeTimer._int=null; activeTimer.className='timerbtn'; }
  activeTimer=btn;
  let left=secs;
  btn.className='timerbtn running';
  btn.textContent='⏸ '+fmtTime(left);
  btn._int=setInterval(()=>{
    left--;
    if(left<=0){
      clearInterval(btn._int); btn._int=null;
      btn.className='timerbtn done'; btn.textContent='✔ Tempo! (tocca per riavviare)';
      if(navigator.vibrate) navigator.vibrate([300,150,300,150,600]);
      beep();
    } else btn.textContent='⏸ '+fmtTime(left);
  },1000);
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,.35,.7].forEach(t0=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; g.gain.setValueAtTime(.4, ctx.currentTime+t0);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t0+.3);
      o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+.3);
    });
  }catch(e){}
}

/* toast */
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 2600);
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* init: all’apertura si sceglie sempre chi si immerge */
render();
showUserScreen();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
